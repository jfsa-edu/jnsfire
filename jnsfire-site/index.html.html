<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전남소방학교 외부강사 안내</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1B3A5F;
    --text:#141413;
    --text-sub:#5F5E5A;
    --text-muted:#9AA5B1;
    --border:#EFEDE7;
    --bg-soft:#F7F6F3;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Nanum Gothic', sans-serif;background:#fff;color:var(--text);}
  a{color:var(--navy);text-decoration:none;}
  .wrap{max-width:960px;margin:0 auto;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;
    height:48px;padding:0 26px;border-radius:6px;
    background:var(--navy);color:#fff;font-size:15px;font-weight:700;
  }

  nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;height:68px;border-bottom:1px solid var(--border);
    position:sticky;top:0;background:#fff;z-index:10;
  }
  nav .brand{font-size:18px;font-weight:800;color:var(--navy);}
  nav .contact{font-size:13px;color:var(--text-sub);}

  .hero{padding:64px 24px 48px 24px;background:var(--bg-soft);}
  .hero .cover{width:100%;max-height:320px;object-fit:cover;border-radius:12px;margin-bottom:28px;display:none;}
  .hero .eyebrow{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:14px;}
  .hero h1{margin:0;font-size:32px;font-weight:800;line-height:1.4;}
  .hero p{margin:16px 0 28px 0;font-size:15px;color:var(--text-sub);line-height:1.8;max-width:560px;}

  section{padding:48px 24px;}
  section h2{font-size:20px;font-weight:800;margin:0 0 22px 0;}

  .facility-grid{
    display:grid;grid-template-columns:repeat(2,1fr);gap:16px;
  }
  .facility-card{
    border:1px solid var(--border);border-radius:10px;padding:20px;
  }
  .facility-card .icon{
    width:40px;height:40px;border-radius:20px;background:var(--navy);
    display:flex;align-items:center;justify-content:center;margin-bottom:12px;
    color:#fff;font-size:16px;font-weight:800;
  }
  .facility-card .title{font-size:15px;font-weight:700;margin-bottom:6px;}
  .facility-card .desc{font-size:13px;color:var(--text-sub);line-height:1.6;white-space:pre-line;}

  .info-bar{
    margin:0 24px;padding:28px 32px;background:var(--navy);border-radius:12px;
    display:grid;grid-template-columns:repeat(2,1fr);gap:20px;
  }
  .info-bar .item .label{font-size:12px;color:#B7C4D3;margin-bottom:4px;}
  .info-bar .item .value{font-size:18px;font-weight:800;color:#fff;}

  .map-wrap{display:flex;gap:20px;flex-wrap:wrap;}
  .map-wrap iframe{flex:1 1 320px;min-height:260px;border:1px solid var(--border);border-radius:10px;}
  .map-wrap .addr{flex:1 1 220px;font-size:14px;color:var(--text-sub);line-height:1.9;}
  .map-wrap .addr b{color:var(--text);}

  footer{
    padding:32px 24px;border-top:1px solid var(--border);
    display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;
  }
  footer .org{font-size:13px;color:var(--text-muted);}

  #loading{padding:120px 0;text-align:center;color:var(--text-muted);font-size:14px;}

  @media (max-width: 640px){
    .hero{padding:44px 20px 36px 20px;}
    .hero h1{font-size:24px;}
    section{padding:36px 20px;}
    .facility-grid{grid-template-columns:1fr;}
    .info-bar{margin:0 20px;grid-template-columns:1fr;}
    nav{padding:0 20px;}
    nav .contact{display:none;}
  }
</style>
</head>
<body>

<div id="loading">불러오는 중...</div>

<div id="page" class="wrap" style="display:none;">

  <nav>
    <div class="brand">전남소방학교</div>
    <div class="contact" id="navContact"></div>
    <a class="btn" href="instructor-registration.html" style="height:38px;padding:0 18px;font-size:14px;">강사 등록 신청</a>
  </nav>

  <div class="hero">
    <img class="cover" id="coverImg" alt="">
    <div class="eyebrow">외부강사 안내</div>
    <h1 id="heroTitle">전남소방학교 출강을 앞둔<br>강사님께 안내드립니다</h1>
    <p>전화 협의를 통해 강의 일정이 확정되신 강사님은 아래 시설·위치 정보를 확인하시고, 담당자가 안내드리는 절차에 따라 자료를 제출해 주시기 바랍니다.<br>처음 강사풀에 등록하시려면 우측 상단 "강사 등록 신청" 버튼을 이용해 주세요.</p>
  </div>

  <section>
    <h2>시설 안내</h2>
    <div class="facility-grid">
      <div class="facility-card">
        <div class="icon">강</div>
        <div class="title">강의실</div>
        <div class="desc" id="infoRoom">-</div>
      </div>
      <div class="facility-card">
        <div class="icon">숙</div>
        <div class="title">숙박시설</div>
        <div class="desc" id="infoStay">-</div>
      </div>
      <div class="facility-card">
        <div class="icon">식</div>
        <div class="title">식당</div>
        <div class="desc" id="infoMeal">-</div>
      </div>
      <div class="facility-card">
        <div class="icon">주</div>
        <div class="title">주차장</div>
        <div class="desc" id="infoParking">-</div>
      </div>
    </div>
  </section>

  <div class="info-bar">
    <div class="item">
      <div class="label">교육 가능 인원</div>
      <div class="value" id="infoCapacity">-</div>
    </div>
    <div class="item">
      <div class="label">담당 부서 · 연락처</div>
      <div class="value" id="infoDept">-</div>
    </div>
  </div>

  <section>
    <h2>오시는 길</h2>
    <div class="map-wrap">
      <iframe id="mapFrame" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
      <div class="addr">
        주소<br><b id="infoAddr">-</b><br><br>
        문의<br><b id="infoPhone">-</b>
      </div>
    </div>
  </section>

  <footer>
    <div class="org">전남소방학교 교육기획팀</div>
  </footer>

</div>

<script>
  var WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwLgHlqLhN79N0Rc1ZvtmsOJH5ocu_5faU_qv62IKWEiUOHQ7_0sZNoG8sGSbGCV8e3/exec';

  fetch(WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: 'getSchoolInfo' })
  })
  .then(function(res){ return res.json(); })
  .then(function(json){
    var info = json.data || {};

    if (info.학교명) document.getElementById('heroTitle').innerHTML = info.학교명 + ' 출강을 앞둔<br>강사님께 안내드립니다';

    document.getElementById('infoRoom').textContent = info.강의실안내 || '안내 예정';
    document.getElementById('infoStay').textContent = info.숙박시설안내 || '안내 예정';
    document.getElementById('infoMeal').textContent = info.식당안내 || '안내 예정';
    document.getElementById('infoParking').textContent = info.주차안내 || '안내 예정';

    document.getElementById('infoCapacity').textContent = info.교육가능인원 || '-';
    document.getElementById('infoDept').textContent = (info.담당부서 || '') + (info.담당자연락처 ? ' · ' + info.담당자연락처 : '');
    document.getElementById('navContact').textContent = info.담당자연락처 || '';

    document.getElementById('infoAddr').textContent = info.주소 || '-';
    document.getElementById('infoPhone').textContent = info.대표전화 || info.담당자연락처 || '-';

    if (info.전경사진) {
      var cover = document.getElementById('coverImg');
      cover.onerror = function(){ cover.style.display = 'none'; };
      cover.src = 'https://drive.google.com/thumbnail?id=' + info.전경사진 + '&sz=w1200';
      cover.style.display = 'block';
    }

    if (info.주소) {
      document.getElementById('mapFrame').src = 'https://maps.google.com/maps?q=' + encodeURIComponent(info.주소) + '&output=embed';
    }

    document.getElementById('loading').style.display = 'none';
    document.getElementById('page').style.display = 'block';
  })
  .catch(function(){
    document.getElementById('loading').textContent = '정보를 불러오지 못했습니다. 잠시 후 새로고침해 주세요.';
  });
</script>

</body>
</html>
